name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit and migration tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Set up Node.js for Firebase CLI
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'test/maplibre-running-tab'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Distribute APK to Firebase Alpha
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'test/maplibre-running-tab'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIAL_FILE" npx -y firebase-tools@15.34.0 appdistribution:distribute             app/build/outputs/apk/debug/app-debug.apk             --app "1:204365877775:android:f77650214127790642497a"             --groups "alpha"             --release-notes "Alpha automático — commit $GITHUB_SHA"

      - name: Deploy owner-scoped Firestore rules
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'test/maplibre-running-tab'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIAL_FILE" npx -y firebase-tools@15.34.0 deploy --only firestore:rules --project "gen-lang-client-0338831300" --non-interactive

      - name: Remove Firebase credential from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Upload test reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-schemas
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
          if-no-files-found: warn
