name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas da versão para o Firebase App Distribution'
        required: false
        default: 'Virtus Alpha Distribution via Service Account'
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.3.1'
  FIREBASE_APP_ID: '1:204365877775:android:f77650214127790642497a'
  FIREBASE_TESTER_GROUPS: 'alpha'

jobs:
  distribute:
    name: Build & Distribute via Service Account
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      STORE_FILE: ${{ runner.temp }}/custom-signing.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare environment and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          elif [ -s "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/custom-signing.jks"
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Distribute to Firebase App Distribution (Service Account only)
        env:
          FIREBASE_APP_DISTRIBUTION_CREDENTIALS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RELEASE_NOTES: ${{ inputs.release_notes || 'Virtus Alpha Release' }}
        run: |
          if [ -n "$FIREBASE_APP_DISTRIBUTION_CREDENTIALS" ]; then
            CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_APP_DISTRIBUTION_CREDENTIALS" > "$CREDENTIAL_FILE"
            chmod 600 "$CREDENTIAL_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIAL_FILE"
            export FIREBASE_APP_DISTRIBUTION_CREDENTIALS="$CREDENTIAL_FILE"
            npx -y firebase-tools@15.34.0 appdistribution:distribute \
              "app/build/outputs/apk/debug/app-debug.apk" \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_TESTER_GROUPS" \
              --release-notes "$FIREBASE_RELEASE_NOTES (commit ${GITHUB_SHA::7})"
          else
            echo "FIREBASE_APP_DISTRIBUTION_CREDENTIALS não configurado nos GitHub Secrets."
          fi

      - name: Clean up temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          rm -f "$RUNNER_TEMP/custom-signing.jks"
